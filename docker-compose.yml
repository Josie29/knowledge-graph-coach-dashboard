services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
      # Small fixed memory footprint — the KG is tiny (~hundreds of nodes)
      # and dev machines shouldn't lose GBs to Neo4j's auto-sizing.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j-data:/data
    deploy:
      resources:
        limits:
          memory: 1500M
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-password} 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # One-shot: builds the knowledge graph, then exits. Idempotent, so it
  # re-runs on every `docker compose up` and converges to the same graph.
  kg-build:
    build: ./backend
    command: ["uv", "run", "--no-sync", "python", "scripts/build_kg.py"]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data:ro
      - ./scripts:/app/scripts:ro
      # fastembed's ONNX model (~130 MB) downloads once, then lives here.
      - model-cache:/root/.cache
    depends_on:
      neo4j:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 768M

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      # The image only contains app/, so data/ is mounted rather than copied.
      # Without this the seed-file fallback in members.py cannot find the
      # context when Neo4j is unreachable.
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data:ro
      - model-cache:/root/.cache
    depends_on:
      neo4j:
        condition: service_healthy
      kg-build:
        condition: service_completed_successfully
    healthcheck:
      # The slim image has no curl; stdlib urllib is enough for a probe.
      # urlopen raises on a non-2xx status, which exits non-zero.
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e",
             "require('http').get('http://localhost:5173/', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  neo4j-data:
  model-cache:
