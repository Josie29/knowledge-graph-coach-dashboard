[project]
name = "kg-coach-backend"
version = "0.1.0"
description = "FastAPI backend for the knowledge-graph coach dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "neo4j>=5.26",
    "pydantic-settings>=2.6",
    "rdflib>=7.1",
    "fastembed>=0.4",
    "pydantic-ai-slim[ag-ui,anthropic]>=1.44",
    "opentelemetry-sdk>=1.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
