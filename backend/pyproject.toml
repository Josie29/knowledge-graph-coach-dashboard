[project]
name = "kg-coach-backend"
version = "0.1.0"
description = "FastAPI backend for the knowledge-graph coach dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "neo4j>=5.26",
    "pydantic-settings>=2.6",
    "rdflib>=7.1",
    "fastembed>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
